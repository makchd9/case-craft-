en a reason or a hearing.`,"Ratio Decidendi (correct answer)":`Any procedure that deprives a person of life or personal liberty under Article 21 must be fair, just, and reasonable — not arbitrary or oppressive.`,"Obiter Dicta (distractor)":`Broader discussion on how Articles 14, 19, and 21 together form one integrated scheme of fundamental rights.`,Domain:`Constitutional`},{"Case Name":`Bachan Singh v. State of Punjab`,"Judgment Snippet (paraphrased, shown to player)":`The constitutionality of the death penalty under Section 302 IPC was challenged as violating Articles 14, 19, and 21.`,"Ratio Decidendi (correct answer)":`The death penalty should be imposed only in the 'rarest of rare' cases, where the alternative option of life imprisonment is unquestionably foreclosed.`,"Obiter Dicta (distractor)":`The illustrative (non-exhaustive) list of aggravating and mitigating circumstances a court may consider.`,Domain:`Criminal`},{"Case Name":`M.C. Mehta v. Union of India (Oleum Gas Leak case)`,"Judgment Snippet (paraphrased, shown to player)":`A hazardous gas leak from a factory in Delhi caused injury to nearby residents.`,"Ratio Decidendi (correct answer)":`An enterprise engaged in a hazardous or inherently dangerous activity owes an absolute and non-delegable duty to the community, with no exceptions for 'Act of God' or third-party fault.`,"Obiter Dicta (distractor)":`Remarks on the need for a specialized environmental tribunal and stricter industrial regulation going forward.`,Domain:`Tort/Environmental`},{"Case Name":`Vishaka v. State of Rajasthan`,"Judgment Snippet (paraphrased, shown to player)":`In the absence of any domestic law on the subject, the Court was asked to address workplace sexual harassment.`,"Ratio Decidendi (correct answer)":`In the absence of domestic legislation, international conventions (like CEDAW) can be read into Articles 14, 19, and 21 to fill the gap, and the Vishaka Guidelines are binding until Parliament legislates.`,"Obiter Dicta (distractor)":`Observations on employer best practices and the need for a complaints committee structure.`,Domain:`Constitutional/Labour`},{"Case Name":`Shreya Singhal v. Union of India`,"Judgment Snippet (paraphrased, shown to player)":`Section 66A of the IT Act criminalized sending 'offensive' messages online, and was challenged as vague and overbroad.`,"Ratio Decidendi (correct answer)":`Section 66A is unconstitutional as it is vague, overbroad, and has a chilling effect on the fundamental right to freedom of speech and expression under Article 19(1)(a).`,"Obiter Dicta (distractor)":`Commentary distinguishing Section 66A from Sections 69A and 79 of the IT Act, which were upheld with safeguards.`,Domain:`Constitutional/IT Law`}],Fake_Case_Detector:[{"Case Name Shown":`Kesavananda Bharati v. State of Kerala`,"Citation Shown":`(1973) 4 SCC 225`,"Short Summary Shown to Player":`Held that Parliament's amending power under Article 368 cannot destroy the Constitution's basic structure.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited landmark case — the origin of the basic structure doctrine.`},{"Case Name Shown":`Justice K.S. Puttaswamy (Retd.) v. Union of India`,"Citation Shown":`(2017) 10 SCC 1`,"Short Summary Shown to Player":`Held that the right to privacy is a fundamental right protected under Article 21.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case — a 9-judge bench decision from 2017.`},{"Case Name Shown":`Vishaka v. State of Rajasthan`,"Citation Shown":`AIR 1997 SC 3011`,"Short Summary Shown to Player":`Laid down guidelines on workplace sexual harassment in the absence of legislation.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case — the source of the 'Vishaka Guidelines'.`},{"Case Name Shown":`M.C. Mehta v. Union of India`,"Citation Shown":`AIR 1987 SC 1086`,"Short Summary Shown to Player":`Introduced the doctrine of absolute liability for hazardous industries, arising from the Oleum Gas Leak.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case, also known as the Oleum Gas Leak case.`},{"Case Name Shown":`Olga Tellis v. Bombay Municipal Corporation`,"Citation Shown":`AIR 1986 SC 180`,"Short Summary Shown to Player":`Held that the right to livelihood is part of the right to life under Article 21.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case concerning pavement dwellers in Mumbai.`},{"Case Name Shown":`Shreya Singhal v. Union of India`,"Citation Shown":`(2015) 5 SCC 1`,"Short Summary Shown to Player":`Struck down Section 66A of the IT Act as unconstitutional for being vague and overbroad.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case protecting online free speech.`},{"Case Name Shown":`Navtej Singh Johar v. Union of India`,"Citation Shown":`(2018) 10 SCC 1`,"Short Summary Shown to Player":`Read down Section 377 IPC to decriminalize consensual same-sex relations between adults.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case.`},{"Case Name Shown":`Indra Sawhney v. Union of India`,"Citation Shown":`AIR 1993 SC 477`,"Short Summary Shown to Player":`Upheld OBC reservations under the Mandal Commission report, capping total reservation at 50%.`,"Real or Fake":`REAL`,"Explanation (revealed after answer)":`This is a real, correctly cited case, also known as the Mandal case.`},{"Case Name Shown":`Ramesh Kumar v. Union of India`,"Citation Shown":`(2016) 9 SCC 234`,"Short Summary Shown to Player":`Allegedly held that access to free Wi-Fi is a fundamental right under Article 21.`,"Real or Fake":`FAKE`,"Explanation (revealed after answer)":`No such case or holding exists. This citation and case name are fabricated — a classic hallucination pattern (plausible name + plausible citation format + no
